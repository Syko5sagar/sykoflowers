<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
GoogleAuthProvider,
signInWithRedirect,
getRedirectResult,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// FIREBASE CONFIG
const firebaseConfig = {

apiKey:"AIzaSyCZl507ZDCKEEok8tn8GXoKaWdvhhSbNlQ",

authDomain:"sykolive-846a3.firebaseapp.com",

databaseURL:"https://sykolive-846a3-default-rtdb.firebaseio.com",

projectId:"sykolive-846a3",

storageBucket:"sykolive-846a3.firebasestorage.app",

messagingSenderId:"705797986997",

appId:"1:705797986997:web:70c8263e3f712758bdbcfc"

};


// INIT
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


// SPLASH
window.onload = ()=>{

setTimeout(()=>{

document.getElementById("splash-screen").style.display = "none";

let m = document.getElementById("main-content");

m.style.display = "flex";

setTimeout(()=>{

m.classList.add("active");

},100);

},2500);

};


// LOGIN BUTTON
document.getElementById("googleBtn").onclick = async()=>{

const btn = document.getElementById("googleBtn");

btn.innerHTML = "Loading...";

try{

await signInWithRedirect(auth,provider);

}catch(e){

console.log(e);

alert(e.message);

btn.innerHTML = `
<img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
width="20"
style="margin-right:10px;">
Google ಮೂಲಕ ಲಾಗಿನ್
`;

}

};


// CHECK REDIRECT RESULT
getRedirectResult(auth)

.then((result)=>{

if(result && result.user){

window.location.href = "profile.html";

}

})

.catch((err)=>{

console.log(err);

});


// ALREADY LOGIN CHECK
onAuthStateChanged(auth,(user)=>{

if(user){

window.location.href = "profile.html";

}

});

</script>
