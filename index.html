<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYKO LOVE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#000;
position:relative;
}

/* Background */

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#ff0080 0%,transparent 25%),
radial-gradient(circle at bottom right,#6a00ff 0%,transparent 25%),
#000;
animation:bgmove 10s infinite alternate;
z-index:-2;
}

@keyframes bgmove{
0%{
transform:scale(1);
filter:hue-rotate(0deg);
}
100%{
transform:scale(1.1);
filter:hue-rotate(30deg);
}
}

/* Floating Hearts */

.heart{
position:absolute;
color:rgba(255,255,255,0.12);
animation:float 10s linear infinite;
}

@keyframes float{

0%{
transform:translateY(100vh) scale(0.5);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.2);
opacity:0;
}

}

/* Splash Screen */

#splash{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
transition:1s;
}

.logo-animation{
display:flex;
gap:12px;
}

.logo-animation span{
font-size:65px;
font-weight:800;
opacity:0;
transform:translateY(30px);
background:linear-gradient(135deg,#ff0080,#6a00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:show 0.6s forwards;
}

.logo-animation span:nth-child(1){animation-delay:0.2s;}
.logo-animation span:nth-child(2){animation-delay:0.4s;}
.logo-animation span:nth-child(3){animation-delay:0.6s;}
.logo-animation span:nth-child(4){animation-delay:0.8s;}

@keyframes show{
100%{
opacity:1;
transform:translateY(0);
}
}

/* Main Card */

.container{
width:360px;
padding:40px 30px;
border-radius:30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 0 35px rgba(0,0,0,0.5);
display:none;
animation:fade 1s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo-icon{
font-size:80px;
margin-bottom:20px;
background:linear-gradient(135deg,#ff0080,#6a00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.title{
font-size:35px;
font-weight:700;
margin-bottom:10px;
}

.title span{
background:linear-gradient(135deg,#ff0080,#6a00ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
font-size:14px;
color:#bbb;
margin-bottom:30px;
}

/* Google Button */

.google-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#fff;
font-size:15px;
font-weight:600;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
transition:0.4s;
}

.google-btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(255,255,255,0.2);
}

.footer{
margin-top:25px;
font-size:12px;
color:#999;
}

/* Mobile */

@media(max-width:450px){

.container{
width:92%;
padding:35px 25px;
}

.logo-animation span{
font-size:50px;
}

}

</style>
</head>
<body>

<div class="bg"></div>

<!-- Floating Hearts -->

<i class="fa-solid fa-heart heart" style="left:10%;font-size:18px;animation-delay:0s;"></i>

<i class="fa-solid fa-heart heart" style="left:30%;font-size:24px;animation-delay:2s;"></i>

<i class="fa-solid fa-heart heart" style="left:50%;font-size:20px;animation-delay:4s;"></i>

<i class="fa-solid fa-heart heart" style="left:70%;font-size:28px;animation-delay:1s;"></i>

<i class="fa-solid fa-heart heart" style="left:90%;font-size:22px;animation-delay:5s;"></i>

<!-- Splash -->

<div id="splash">

<div class="logo-animation">

<span>S</span>
<span>Y</span>
<span>K</span>
<span>O</span>

</div>

</div>

<!-- Main -->

<div class="container" id="main">

<div class="logo-icon">
<i class="fa-solid fa-heart-pulse"></i>
</div>

<div class="title">
<span>SYKO</span> LOVE
</div>

<div class="sub">
Premium Relationship Experience ❤️
</div>

<button class="google-btn" id="googleBtn">

<img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg">

Continue with Google

</button>

<div class="footer">
Made with ❤️ by SYKO
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* Firebase Config */

const firebaseConfig = {

apiKey: "AIzaSyCZl507ZDCKEEok8tn8GXoKaWdvhhSbNlQ",

authDomain: "sykolive-846a3.firebaseapp.com",

projectId: "sykolive-846a3",

storageBucket: "sykolive-846a3.appspot.com",

messagingSenderId: "123456789",

appId: "1:123456789:web:abcdef"

};

/* Firebase Start */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

/* Splash Screen */

window.addEventListener('load',()=>{

setTimeout(()=>{

document.getElementById('splash').style.opacity='0';

setTimeout(()=>{

document.getElementById('splash').style.display='none';

document.getElementById('main').style.display='block';

},1000);

},2500);

});

/* Google Login */

document.getElementById('googleBtn').addEventListener('click',()=>{

signInWithPopup(auth,provider)

.then((result)=>{

window.location.href="home.html";

})

.catch((error)=>{

alert(error.message);

});

});

</script>

</body>
</html>
