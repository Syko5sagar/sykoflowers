<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rent bf/gf - Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:#fff;
    padding-top:90px;
}

/* HEADER */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#000;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #32cd32;
    z-index:1000;
}

.app-name{
    color:#32cd32;
    font-size:24px;
    font-weight:800;
    font-style:italic;
}

.my-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#111;
    padding:4px 10px;
    border-radius:30px;
    border:1px solid #ff007f;
    cursor:pointer;
}

.my-box img{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
}

.my-box span{
    color:#ff007f;
    font-size:12px;
    font-weight:bold;
}

/* FEED */

.feed{
    width:100%;
    max-width:450px;
    margin:auto;
    padding:15px;
}

.card{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:25px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(255,0,150,0.1);
}

.card-top{
    display:flex;
    gap:14px;
    align-items:center;
}

.user-pic{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff4d4d;
}

.user-details{
    flex:1;
}

.user-details h3{
    color:#4da6ff;
    font-size:18px;
}

.rate{
    color:#ff007f;
    font-weight:bold;
    font-size:15px;
}

.comm-icons{
    display:flex;
    gap:10px;
}

.btn-circle{
    width:42px;
    height:42px;
    background:#fff;
    color:#000;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
}

.btn-circle:hover{
    transform:scale(1.08);
}

.main-btn{
    width:100%;
    margin-top:15px;
    border:none;
    outline:none;
    background:linear-gradient(45deg,#ff007f,#ff00e5);
    color:white;
    padding:12px;
    border-radius:15px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.empty{
    text-align:center;
    color:#777;
    margin-top:40px;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="app-name">
        Rent bf/gf
    </div>

    <div class="my-box" onclick="goProfile()">
        <img id="headPic" src="https://via.placeholder.com/100">
        <span id="headName">User</span>
    </div>

</div>

<!-- USERS -->

<div class="feed" id="live-users">

    <p class="empty">Loading users...</p>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.appspot.com",

    messagingSenderId: "YOUR_SENDER_ID",

    appId: "YOUR_APP_ID"

};

/* INIT */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

/* GLOBAL USER */

let currentUID = null;

/* PROFILE */

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        alert("Login first");

        window.location.href = "login.html";

        return;
    }

    currentUID = user.uid;

    try{

        const snap = await getDoc(doc(db,"users",user.uid));

        if(snap.exists()){

            const data = snap.data();

            document.getElementById("headPic").src =
            data.profilePic || "https://via.placeholder.com/100";

            document.getElementById("headName").innerText =
            data.name || "User";
        }

    }catch(err){

        console.log(err);

    }

});

/* LIVE USERS */

const usersRef = collection(db,"users");

onSnapshot(usersRef,(snapshot)=>{

    const container = document.getElementById("live-users");

    container.innerHTML = "";

    if(snapshot.empty){

        container.innerHTML =
        `<p class="empty">No users found</p>`;

        return;
    }

    snapshot.forEach((docSnap)=>{

        const u = docSnap.data();

        /* OWN PROFILE HIDE */

        if(u.uid === currentUID) return;

        container.innerHTML += `

        <div class="card">

            <div class="card-top">

                <img
                    src="${u.profilePic || 'https://via.placeholder.com/150'}"
                    class="user-pic"
                >

                <div class="user-details">

                    <h3>${u.name || 'Unknown'}, ${u.age || '18'}</h3>

                    <div class="rate">
                        ₹${u.rate || '0'} / Day
                    </div>

                </div>

                <div class="comm-icons">

                    <div
                        class="btn-circle"
                        onclick="openChat('${u.uid}','${u.name}')"
                    >
                        <i class="fa-solid fa-comment"></i>
                    </div>

                    <div
                        class="btn-circle"
                        onclick="openVideo('${u.uid}')"
                    >
                        <i class="fa-solid fa-video"></i>
                    </div>

                </div>

            </div>

            <button
                class="main-btn"
                onclick="bookNow('${u.uid}')"
            >
                ಈಗಲೇ ಬುಕ್ ಮಾಡಿ
            </button>

        </div>

        `;

    });

});

/* FUNCTIONS */

window.openChat = (uid,name)=>{

    window.location.href =
    `chat.html?target=${uid}&name=${encodeURIComponent(name)}`;

};

window.openVideo = (uid)=>{

    window.location.href =
    `video.html?room=${uid}`;

};

window.bookNow = (uid)=>{

    alert("Booking Started : " + uid);

};

window.goProfile = ()=>{

    window.location.href = "profile.html";

};

</script>

</body>
</html>
