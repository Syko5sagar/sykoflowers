<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Users</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
}

.header{
padding:15px;
font-size:22px;
font-weight:bold;
text-align:center;
background:#ff0050;
}

#users{
padding:10px;
}

.user{
background:#1c1c1c;
padding:12px;
border-radius:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.online{
color:#00ff99;
font-size:14px;
}

.offline{
color:#999;
font-size:14px;
}

button{
background:#ff0050;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-weight:bold;
}

#incoming{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1c1c1c;
padding:20px;
border-radius:20px;
display:none;
width:300px;
text-align:center;
z-index:999;
box-shadow:0 0 20px #000;
}

#incoming h2{
margin-top:0;
}

.accept{
background:#00c853;
margin-right:10px;
}

.reject{
background:red;
}
</style>
</head>

<body>

<div class="header">
LIVE USERS
</div>

<div id="users"></div>

<div id="incoming">
<h2>Incoming Call</h2>
<p id="callerText"></p>

<button class="accept" onclick="acceptCall()">
Accept
</button>

<button class="reject" onclick="rejectCall()">
Reject
</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
onSnapshot,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_BUCKET",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let uid = localStorage.getItem("uid");

if(!uid){
uid = "user_" + Math.random().toString(36).substr(2,9);
localStorage.setItem("uid",uid);
}

await setDoc(doc(db,"users",uid),{
uid:uid,
online:true,
lastSeen:serverTimestamp()
},{merge:true});

window.addEventListener("beforeunload",async()=>{
await updateDoc(doc(db,"users",uid),{
online:false
});
});

const usersDiv = document.getElementById("users");

onSnapshot(collection(db,"users"),(snap)=>{

usersDiv.innerHTML="";

snap.forEach((docSnap)=>{

let data = docSnap.data();

if(data.uid === uid) return;

let div = document.createElement("div");
div.className="user";

div.innerHTML=`
<div>
<div>${data.uid}</div>
<div class="${data.online ? 'online':'offline'}">
${data.online ? 'Online':'Offline'}
</div>
</div>

<button onclick="callUser('${data.uid}')">
Video Call
</button>
`;

usersDiv.appendChild(div);

});

});

window.callUser = async(id)=>{

let room = [uid,id].sort().join("_");

await setDoc(doc(db,"calls",room),{
caller:uid,
receiver:id,
status:"calling",
time:Date.now()
});

location.href=`connect.html?room=${room}&user=${uid}`;

};

let currentRoom="";

onSnapshot(collection(db,"calls"),(snap)=>{

snap.forEach((d)=>{

let call = d.data();

if(call.receiver===uid && call.status==="calling"){

currentRoom=d.id;

document.getElementById("incoming").style.display="block";

document.getElementById("callerText").innerText=
call.caller + " is calling you";

}

});

});

window.acceptCall = async()=>{

await updateDoc(doc(db,"calls",currentRoom),{
status:"accepted"
});

location.href=`connect.html?room=${currentRoom}&user=${uid}`;

};

window.rejectCall = async()=>{

await updateDoc(doc(db,"calls",currentRoom),{
status:"rejected"
});

document.getElementById("incoming").style.display="none";

};

</script>

</body>
</html>
