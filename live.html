<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYKO LIVE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f0f0f;
color:#fff;
}


/* HEADER */
.header{
padding:15px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:100;
border-bottom:2px solid #ff0050;
}


/* LOGO */
.logo{
font-size:24px;
font-weight:bold;
letter-spacing:2px;
}

.blink{
background:linear-gradient(45deg,#ff0050,#00ffe1,#ff0050);
background-size:300% 300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:blinkGlow 2s linear infinite;
font-weight:bold;
text-shadow:0 0 10px rgba(255,0,80,0.7);
}

@keyframes blinkGlow{

0%{
background-position:0% 50%;
opacity:1;
transform:scale(1);
}

25%{
opacity:.6;
}

50%{
background-position:100% 50%;
opacity:1;
transform:scale(1.05);
}

75%{
opacity:.7;
}

100%{
background-position:0% 50%;
opacity:1;
transform:scale(1);
}

}


/* MY PROFILE */
.myProfile{
display:flex;
align-items:center;
gap:10px;
}

.myProfile img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
border:2px solid #fff;
}

.myProfile div{
font-size:14px;
font-weight:bold;
}


/* USERS */
#users{
padding:10px;
}

.user{
background:#1c1c1c;
padding:12px;
border-radius:15px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #2d2d2d;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}


/* LEFT */
.left{
display:flex;
align-items:center;
gap:12px;
}

.left img{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:2px solid #ff0050;
}

.name{
font-size:17px;
font-weight:bold;
margin-bottom:5px;
}

.online{
color:#00ff99;
font-size:13px;
}

.offline{
color:#999;
font-size:13px;
}


/* RIGHT BUTTONS */
.actions{
display:flex;
flex-direction:column;
gap:8px;
}

.chatBtn{
background:#2979ff;
}

.callBtn{
background:#ff0050;
}

button{
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}


/* INCOMING */
#incoming{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1c1c1c;
padding:20px;
border-radius:20px;
display:none;
width:300px;
text-align:center;
z-index:999;
box-shadow:0 0 20px #000;
}

#incoming img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
border:3px solid #ff0050;
}

.accept{
background:#00c853;
margin-right:10px;
}

.reject{
background:red;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="logo">

<span class="blink">

SYKO LIVE

</span>

</div>

<div class="myProfile">

<img id="myPic">

<div id="myName">

User

</div>

</div>

</div>


<!-- USERS -->
<div id="users"></div>


<!-- INCOMING CALL -->
<div id="incoming">

<img id="callerPic">

<h2>Incoming Call</h2>

<p id="callerText"></p>

<br>

<button class="accept" onclick="acceptCall()">

Accept

</button>

<button class="reject" onclick="rejectCall()">

Reject

</button>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
setDoc,
collection,
onSnapshot,
updateDoc,
serverTimestamp,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// FIREBASE CONFIG
const firebaseConfig = {

apiKey:"AIzaSyCZl507ZDCKEEok8tn8GXoKaWdvhhSbNlQ",

authDomain:"sykolive-846a3.firebaseapp.com",

databaseURL:"https://sykolive-846a3-default-rtdb.firebaseio.com",

projectId:"sykolive-846a3",

storageBucket:"sykolive-846a3.firebasestorage.app",

messagingSenderId:"705797986997",

appId:"1:705797986997:web:70c8263e3f712758bdbcfc"

};


// INIT
const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


let uid = "";


// LOGIN CHECK
onAuthStateChanged(auth,async(user)=>{

if(user){

uid = user.uid;


// GET PROFILE
const myName =
localStorage.getItem("profile_name") || "User";

const myPic =
localStorage.getItem("profile_pic") || "";


// TOP PROFILE
document.getElementById("myName").innerText = myName;

document.getElementById("myPic").src = myPic;


// SAVE USER
await setDoc(doc(db,"users",uid),{

uid:uid,

name:myName,

profilePic:myPic,

online:true,

lastSeen:Date.now()

},{merge:true});


// LOAD USERS
loadUsers();


// CALL LISTENER
listenCalls();

}else{

location.href="index.html";

}

});


// OFFLINE
window.addEventListener("beforeunload",()=>{

if(uid){

updateDoc(doc(db,"users",uid),{

online:false

});

}

});


// LOAD USERS
function loadUsers(){

const usersDiv = document.getElementById("users");

onSnapshot(collection(db,"users"),(snapshot)=>{

usersDiv.innerHTML="";

snapshot.forEach((docSnap)=>{

const data = docSnap.data();


// DON'T SHOW MYSELF
if(data.uid === uid) return;


// USER BOX
const div = document.createElement("div");

div.className = "user";

div.innerHTML = `

<div class="left">

<img src="${data.profilePic || ''}">

<div>

<div class="name">

${data.name || 'User'}

</div>

<div class="${data.online ? 'online':'offline'}">

${data.online ? 'Online':'Offline'}

</div>

</div>

</div>


<div class="actions">

<button class="chatBtn"
onclick="openChat('${data.uid}')">

Chat

</button>

<button class="callBtn"
onclick="callUser('${data.uid}')">

Video Call

</button>

</div>

`;

usersDiv.appendChild(div);

});

});

}


// CHAT PAGE
window.openChat = (id)=>{

localStorage.setItem("chat_user",id);

window.location.href="chat.html";

};


// VIDEO CALL
window.callUser = async(id)=>{

let room = [uid,id].sort().join("_");

await setDoc(doc(db,"calls",room),{

caller:uid,

receiver:id,

status:"calling",

time:Date.now()

});

window.location.href=
`connect.html?room=${room}&user=${uid}`;

};


// CALL LISTENER
let currentRoom="";

function listenCalls(){

onSnapshot(collection(db,"calls"),(snap)=>{

snap.forEach((d)=>{

let call = d.data();

if(call.receiver===uid &&
call.status==="calling"){

currentRoom=d.id;

document.getElementById("incoming").style.display="block";

document.getElementById("callerText").innerText =
"Incoming video call";


// FIND CALLER PIC
onSnapshot(collection(db,"users"),(u)=>{

u.forEach((x)=>{

let ud=x.data();

if(ud.uid===call.caller){

document.getElementById("callerPic").src =
ud.profilePic;

}

});

});

}

});

});

}


// ACCEPT
window.acceptCall = async()=>{

await updateDoc(doc(db,"calls",currentRoom),{

status:"accepted"

});

window.location.href=
`connect.html?room=${currentRoom}&user=${uid}`;

};


// REJECT
window.rejectCall = async()=>{

await updateDoc(doc(db,"calls",currentRoom),{

status:"rejected"

});

document.getElementById("incoming").style.display="none";

};

</script>

</body>
</html>
