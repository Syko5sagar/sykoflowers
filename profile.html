<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Setup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:15px;
}

.box{
width:100%;
max-width:400px;
padding:25px;
border-radius:25px;
border:2px solid #00ff00;
text-align:center;
background:#111;
box-shadow:0 0 20px rgba(0,255,0,0.2);
}

h2{
margin-bottom:20px;
font-size:28px;
}

.photo{
width:120px;
height:120px;
border-radius:50%;
background:#222;
margin:0 auto 20px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
overflow:hidden;
border:2px dashed red;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.photo i{
font-size:35px;
color:#00ff00;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:12px;
border:1px solid red;
background:#000;
color:#fff;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:15px;
background:#00ff00;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:15px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

</style>
</head>

<body>

<div class="box">

<h2>Profile Setup</h2>

<div class="photo" id="photoBox">

<i id="icon">📷</i>

<img id="preview">

</div>

<input type="file" id="fileInput" hidden accept="image/*">

<input type="text" id="name" placeholder="Enter Name">

<button id="nextBtn">

SAVE & NEXT

</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// FIREBASE CONFIG
const firebaseConfig = {

apiKey:"AIzaSyCZl507ZDCKEEok8tn8GXoKaWdvhhSbNlQ",

authDomain:"sykolive-846a3.firebaseapp.com",

databaseURL:"https://sykolive-846a3-default-rtdb.firebaseio.com",

projectId:"sykolive-846a3",

storageBucket:"sykolive-846a3.firebasestorage.app",

messagingSenderId:"705797986997",

appId:"1:705797986997:web:70c8263e3f712758bdbcfc"

};


// INIT
const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


// VARIABLES
let userId = null;

let imageData = "";


// ELEMENTS
const photoBox = document.getElementById("photoBox");

const fileInput = document.getElementById("fileInput");

const preview = document.getElementById("preview");

const icon = document.getElementById("icon");

const nextBtn = document.getElementById("nextBtn");

const nameInput = document.getElementById("name");


// PHOTO CLICK
photoBox.onclick = ()=>{

fileInput.click();

};


// CHECK LOGIN
onAuthStateChanged(auth,(user)=>{

if(user){

userId = user.uid;


// AUTO FILL GMAIL NAME
nameInput.value = user.displayName || "";

}else{

alert("Login Required");

window.location.href = "index.html";

}

});


// IMAGE SELECT
fileInput.addEventListener("change",(e)=>{

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = ()=>{

imageData = reader.result;

preview.src = imageData;

preview.style.display = "block";

icon.style.display = "none";

};

reader.readAsDataURL(file);

});


// SAVE PROFILE
nextBtn.onclick = async()=>{

const name = nameInput.value.trim();


// VALIDATION
if(!name || !imageData){

alert("Fill all fields");

return;

}

if(!userId){

alert("User not logged in");

return;

}


try{

nextBtn.innerText = "Saving...";


// FIRESTORE SAVE
await setDoc(doc(db,"users",userId),{

uid:userId,

name:name,

profilePic:imageData,

isOnline:true,

createdAt:Date.now()

});


// LOCAL STORAGE
localStorage.setItem("profile_name",name);

localStorage.setItem("profile_pic",imageData);


alert("Profile Saved");


// GO LIVE PAGE
setTimeout(()=>{

window.location.href = "live.html";

},500);


}catch(err){

console.log(err);

alert(err.message);

nextBtn.innerText = "SAVE & NEXT";

}

};

</script>

</body>
</html>
